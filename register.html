<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Neumorphic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="asset/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 style="font-size: 26px; font-weight: 800; letter-spacing: 1px; color: #5b56a6; text-transform: lowercase; margin-bottom: 8px;">ajogalehlauak</h1>
        <h2 class="auth-title">Buat Akun Baru</h2>
        <p class="auth-subtitle">Mulai jelajahi pengalaman Neumorphism terbaik</p>
      </div>

      <form action="index.html" method="GET">
        <div class="form-group">
          <label class="nm-label">Nama Lengkap</label>
          <input type="text" class="nm-input" placeholder="Masukkan nama Anda" required>
        </div>

        <div class="form-group">
          <label class="nm-label">Email</label>
          <input type="email" class="nm-input" placeholder="nama@email.com" required>
        </div>

        <div class="form-group">
          <label class="nm-label">Password</label>
          <input type="password" class="nm-input" placeholder="Minimal 8 karakter" required>
        </div>

        <div class="form-group">
          <label class="nm-checkbox-wrapper">
            <input type="checkbox" required style="display: none;">
            <div class="nm-checkbox">✓</div>
            <span style="font-size: 12px;">Saya menyetujui <button type="button" onclick="alert('Syarat & Ketentuan ajogalehlauak: Sistem platform administrasi ini diperuntukkan bagi distribusi hasil laut terstandar HACCP.')" style="background: none; border: none; padding: 0; color: #5b56a6; cursor: pointer; text-decoration: underline; font-size: 12px;">Syarat & Ketentuan</button></span>
          </label>
        </div>

        <button type="submit" class="btn btn-purple" style="width: 100%; padding: 13px; font-size: 14px; border-radius: 16px;">
          Daftar Sekarang
        </button>
      </form>

      <div style="text-align: center; margin-top: 28px; font-size: 13px; color: var(--text-muted);">
        Sudah memiliki akun? <a href="login.html" style="color: #38c8a7; font-weight: 600; text-decoration: none;">Masuk di sini</a>
      </div>
    </div>
  </div>

</body>
</html>
