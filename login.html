<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Neumorphic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="asset/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 style="font-size: 26px; font-weight: 800; letter-spacing: 1px; color: #5b56a6; text-transform: lowercase; margin-bottom: 8px;">ajogalehlauak</h1>
        <h2 class="auth-title">Selamat Datang</h2>
        <p class="auth-subtitle">Masuk ke akun ajogalehlauak</p>
      </div>

      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="nm-label">Email atau Username</label>
          <input type="text" class="nm-input" id="login_email" placeholder="nama@email.com" required value="jessica@ajogaleh.com">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label class="nm-label" style="margin-bottom: 0;">Password</label>
            <a href="#" style="font-size: 11.5px; color: #5b56a6; text-decoration: none;">Lupa password?</a>
          </div>
          <input type="password" class="nm-input" id="login_pass" placeholder="••••••••" required value="secret123">
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
          <label class="nm-checkbox-wrapper">
            <input type="checkbox" checked style="display: none;">
            <div class="nm-checkbox">✓</div>
            <span>Ingat saya</span>
          </label>
        </div>

        <button type="submit" class="btn btn-teal" style="width: 100%; padding: 13px; font-size: 14px; border-radius: 16px;">
          Masuk ke Dashboard
        </button>
      </form>

      <div style="text-align: center; margin: 24px 0 14px 0; font-size: 12px; color: var(--text-muted); position: relative;">
        <span>Atau masuk dengan</span>
      </div>

      <div class="social-login">
        <button class="social-btn">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.4l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.7c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.2C.7 9.6 0 12.2 0 15s.7 5.4 1.9 7.8l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.4C3.7 20.3 7.5 23 12 23z"/></svg>
          Google
        </button>
        <button class="social-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Facebook
        </button>
      </div>

      <div style="text-align: center; margin-top: 28px; font-size: 13px; color: var(--text-muted);">
        Belum punya akun? <a href="register.html" style="color: #f76587; font-weight: 600; text-decoration: none;">Daftar di sini</a>
      </div>
    </div>
  </div>

  <script src="asset/data/mock-data.js"></script>
  <script src="asset/js/api-service.js"></script>
  <script src="asset/js/app-framework.js"></script>
  <script>
    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById("login_email").value.trim();
      const pass = document.getElementById("login_pass").value;

      try {
        const result = await window.ajoApi.login(email, pass);
        window.ajoFramework.showToast("success", "Login Berhasil", `Selamat datang kembali, ${result.user.name}!`);
        setTimeout(() => {
          window.location.href = "index.html";
        }, 600);
      } catch (err) {
        window.ajoFramework.showToast("danger", "Autentikasi Gagal", err.message);
      }
    }
  </script>
</body>
</html>
